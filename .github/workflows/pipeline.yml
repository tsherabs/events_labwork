name: Site pipeline 

on: push

jobs:
    test:
        runs-on: ubuntu-latest
        steps: 
            - name: Fetch the repository 
              uses: actions/checkout@v4
            
            - name: Install Python
              uses: actions/setup-python@v5
              with: 
                python-version: "3.12" 
            
            - name: Install the test runner
              run: pip intall pytest 

            - name: Run the test 
              run: pytest -q 


